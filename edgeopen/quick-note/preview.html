<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="preview.css">
  <title>随心记 · 图片预览</title>
</head>
<body>
  <div class="viewer" id="viewer">
    <img id="img" alt="" draggable="false">
    <div class="toolbar">
      <button id="btn-zoom-out" title="缩小（-）">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="放大（+）">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
      <button id="btn-reset" title="重置（0）">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 6V3l-4 4 4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <button id="btn-download" title="下载原图">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
      <button id="btn-close" title="关闭（Esc）">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="loading" id="loading">图片加载中…</div>
    <div class="error" id="error" hidden>图片加载失败</div>
  </div>
  <script src="imageStore.js"></script>
  <script src="preview.js"></script>
</body>
</html>
